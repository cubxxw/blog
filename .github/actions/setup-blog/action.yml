name: Setup blog toolchain
description: Install the versioned Node, Hugo and locked build dependencies.
inputs:
  browsers:
    description: Space-separated Playwright browsers to install; empty skips browser installation.
    default: chromium
runs:
  using: composite
  steps:
    - name: Read pinned toolchain
      id: versions
      shell: bash
      run: |
        node -e 'const c=require("./config/ci-toolchain.json"); for(const k of ["node","hugo","actionlint"]){if(!/^\d+\.\d+\.\d+$/.test(c[k]))throw new Error(`Invalid ${k} version`);console.log(`${k}=${c[k]}`)}' >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.versions.outputs.node }}
        cache: npm
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ steps.versions.outputs.hugo }}
        extended: true
    - name: Install the pinned workflow validator
      shell: bash
      env:
        BLOG_ACTIONLINT_VERSION: ${{ steps.versions.outputs.actionlint }}
      run: |
        tool_dir="$RUNNER_TEMP/blog-actionlint-$BLOG_ACTIONLINT_VERSION"
        mkdir -p "$tool_dir"
        cd "$tool_dir"
        curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$BLOG_ACTIONLINT_VERSION/actionlint_${BLOG_ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$BLOG_ACTIONLINT_VERSION/actionlint_${BLOG_ACTIONLINT_VERSION}_checksums.txt"
        sha256sum --check --ignore-missing "actionlint_${BLOG_ACTIONLINT_VERSION}_checksums.txt"
        tar -xzf "actionlint_${BLOG_ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
        echo "$tool_dir" >> "$GITHUB_PATH"
    - name: Install locked dependencies
      shell: bash
      env:
        # Critical CSS uses the pinned Playwright Chromium installed below.
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      run: npm ci && npm ci --prefix netlify/functions
    - name: Install browsers
      if: inputs.browsers != ''
      shell: bash
      env:
        BLOG_BROWSERS: ${{ inputs.browsers }}
      run: |
        read -r -a browsers <<< "$BLOG_BROWSERS"
        npx --no-install playwright install --with-deps "${browsers[@]}"
