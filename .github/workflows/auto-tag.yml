name: Create Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  create_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.event.comment.body, '/create tag')
    steps:
      - name: Authorize repository maintainer
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq '.permission')
          case "$permission" in admin|maintain|write) ;; *) echo 'Maintainer permission required'; exit 1 ;; esac
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate version number and get comment
        id: validate
        env:
          TAG_COMMAND: ${{ github.event.comment.body }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const match = (process.env.TAG_COMMAND || '').match(/^\/create tag[ \t]+(v\d+\.\d+\.\d+)(?:[ \t]+"([^"\r\n]*)")?[ \t]*$/);
          if (!match) throw new Error('Expected /create tag v1.2.3 optionally followed by a quoted one-line annotation');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\ntag_comment=${match[2] || `Release ${match[1]}`}\n`);
          JS

      - name: Create a new tag
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          TAG_COMMENT: ${{ steps.validate.outputs.tag_comment }}
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$VERSION" -m "$TAG_COMMENT"
          git push origin "$VERSION"
          echo "tag_created=$VERSION" >> "$GITHUB_OUTPUT"
