name: Resident observation diagnostic only
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [current, 'off']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-blog
        with:
          browsers: chromium
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: tests/.artifacts/resident-input
          merge-multiple: true
      - name: Two fresh-browser observations with original budgets
        env:
          GH_TOKEN: ${{ github.token }}
          RESIDENT_TRACE_DIAGNOSTIC: ${{ matrix.variant }}
          DIAG_SOURCE: ${{ inputs.source_sha }}
          DIAG_RUN: ${{ inputs.run_id }}
          DIAG_ARTIFACT: ${{ inputs.artifact_id }}
        run: node scripts/diagnose-resident-pair.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resident-pair-${{ github.run_id }}-${{ matrix.variant }}
          path: tests/.artifacts/resident-pair/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
