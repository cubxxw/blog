name: Diagnose public audio delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Public audio network audit (never a release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download real unchanged audio from production and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 150 --output /tmp/rain.flac --write-out 'rain http=%{http_code} bytes=%{size_download} ttfb=%{time_starttransfer}s total=%{time_total}s\n' https://cubxxw.com/audio/space/rain-distant-storm-loop.flac
          echo '163b7f4df1345f2d54a35ae041116987544eca12dc0397105537b4eb76c999fb  /tmp/rain.flac' | sha256sum --check
          curl --fail --silent --show-error --max-time 90 --output /tmp/music.mp3 --write-out 'music http=%{http_code} bytes=%{size_download} ttfb=%{time_starttransfer}s total=%{time_total}s\n' https://cubxxw.com/audio/space/night-on-the-docks-sax.mp3
          echo '8ccfb78466fe24e22b621672d4784f78d8954f6a93a5d4bc7adccaea1b0fdb18  /tmp/music.mp3' | sha256sum --check
