name: Recheck an existing site artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original verified main workflow run ID
        required: true
        type: string
      artifact_id:
        description: Immutable deployment artifact ID from that run
        required: true
        type: string
      source_sha:
        description: Full source commit of that artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-blog
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: tests/.artifacts/recheck
          merge-multiple: true
      - name: Check frozen production pages only
        env:
          RECHECK_SHA: ${{ inputs.source_sha }}
        run: |
          node scripts/ci-changes.mjs --head "$RECHECK_SHA" --out tests/.artifacts/recheck-changes.json
          node scripts/site-verify.mjs --public-dir tests/.artifacts/recheck/public --page-map tests/.artifacts/recheck/page-map.json --change-set tests/.artifacts/recheck-changes.json --report-dir tests/.artifacts/recheck-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-recheck-${{ github.run_id }}
          path: tests/.artifacts/recheck-report/
          retention-days: 30
