name: Diagnose camera timing on frozen candidate
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Frozen candidate producer run
        required: true
        type: string
      artifact_id:
        description: Immutable frozen input artifact
        required: true
        type: string
      source_sha:
        description: Exact candidate test source
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: Diagnostic only (never a release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-blog
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: tests/.artifacts/camera-input
          merge-multiple: true
      - name: Reproduce exact camera contracts without rebuilding production
        env:
          SITE_OUTPUT_DIR: ${{ github.workspace }}/tests/.artifacts/camera-input/site/public
          PLAYWRIGHT_JSON_OUTPUT_FILE: tests/.artifacts/camera-report.json
        run: >-
          npx playwright test tests/e2e/space-living-motion.spec.ts
          --grep 'approach can be reversed|resizing during a window'
          --project=desktop --project=mobile --workers=1 --retries=0 --trace=on
          --reporter=line,json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: camera-diagnostic-${{ github.run_id }}
          path: |
            tests/.artifacts/camera-report.json
            test-results/
          if-no-files-found: error
          retention-days: 7
