name: Playwright E2E Tests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Temporary focused diagnostic or the full E2E suites"
        type: choice
        options: [full, session-tree-diagnostic]
        default: full
      diagnostic_url:
        description: "Verified deploy preview base URL for the focused diagnostic"
        type: string
        default: "https://deploy-preview-403--cubxxw.netlify.app"

jobs:
  e2e:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'session-tree-diagnostic'
    runs-on: ubuntu-latest
    env:
      # Match the production renderer pinned in netlify.toml.
      HUGO_VERSION: 0.145.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate homepage stream and link safety
        run: node --test scripts/home-chat-utils.test.mjs

      - name: Validate interactive specs (dependency-free gate, issue #389)
        run: node scripts/check-interactive-specs.mjs

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Validate interactive specs and fixtures (needs Hugo, issue #389)
        run: npm run interactive:check

      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "http://localhost:1313/"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Hugo server and run Playwright tests
        run: |
          hugo server --port 1313 --disableFastRender &
          HUGO_PID=$!
          timeout 60 bash -c "until curl -sf http://localhost:1313/ > /dev/null; do
            kill -0 $HUGO_PID 2>/dev/null || { echo 'Hugo server exited unexpectedly'; exit 1; }
            sleep 1
          done"
          npx playwright test --grep-invert "Visual Regression"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload diff screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diff-screenshots
          path: test-results/
          retention-days: 7

  interactive:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'session-tree-diagnostic'
    name: Interactive components (Chromium/Firefox/WebKit)
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.145.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Validate interactive specs and fixtures (needs Hugo, issue #389)
        run: npm run interactive:check

      - name: Install Playwright browsers (all three engines)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-engine interactive suite (production output)
        run: npm run interactive:test

      - name: Upload interactive Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interactive-playwright-report
          path: playwright-report/interactive/
          retention-days: 7

      - name: Upload interactive test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interactive-test-results
          path: test-results/
          retention-days: 7

  session-tree-diagnostic:
    name: Temporary Linux WebKit session-tree diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'session-tree-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Measure the deployed English Pi component
        env:
          SESSION_TREE_DIAGNOSTIC_URL: ${{ inputs.diagnostic_url }}
          SESSION_TREE_DIAGNOSTIC_DIR: test-results/session-tree-diagnostic
        run: node scripts/diagnose-session-tree.mjs
      - name: Upload exact geometry and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-tree-linux-webkit-diagnostic
          path: test-results/session-tree-diagnostic/
          retention-days: 7
