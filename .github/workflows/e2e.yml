name: Browser DOM snapshot cost diagnostic only
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-blog
        with:
          browsers: chromium
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: tests/.artifacts/trace-input
          merge-multiple: true
      - name: Alternate full and video-only trace on one runner with the same physical journey
        env:
          DIAG_SOURCE: ${{ inputs.source_sha }}
          DIAG_RUN: ${{ inputs.run_id }}
          DIAG_ARTIFACT: ${{ inputs.artifact_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {spawnSync,execFileSync} from 'node:child_process';
          import {verifyFrozenProof} from './scripts/ci-shards.mjs';
          const dir=path.resolve('tests/.artifacts/trace-input'),bundleRoot=path.join(dir,'site');
          const read=name=>JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'));
          const plan=read('plan.json'),changeSet=read('changes.json'),proof=read('frozen.json');
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(source,process.env.DIAG_SOURCE);assert.equal(source,proof.sourceSha);assert.equal(proof.runId,process.env.DIAG_RUN);
          verifyFrozenProof({bundleRoot,plan,changeSet,proof});
          const output=path.resolve('tests/.artifacts/trace-compare');fs.mkdirSync(output,{recursive:true});
          const file='playwright.config.ts',before=fs.readFileSync(file,'utf8');
          const original="trace: { mode: 'retain-on-failure', screenshots: true, snapshots: true, sources: true },";
          assert.equal(before.split(original).length,2);
          const base=new URL(JSON.parse(fs.readFileSync(path.join(bundleRoot,'page-map.json'),'utf8')).baseUrl),runs=[];
          const variants=['full','no-dom','no-dom','full','full','no-dom'];
          try {
            for(const [index,variant]of variants.entries()){
              const here=path.join(output,String(index+1)+'-'+variant);fs.mkdirSync(here,{recursive:true});
              const config=before.replace(original,`trace: { mode: 'on', screenshots: true, snapshots: ${variant==='full'}, sources: true },`);
              fs.writeFileSync(file,config);fs.writeFileSync(path.join(here,'actual-config.ts'),config);
              const started=Date.now();console.log('TRACE_COMPARE_BEGIN',JSON.stringify({index:index+1,variant,source,at:new Date().toISOString()}));
              const result=spawnSync(process.execPath,['node_modules/@playwright/test/cli.js','test','tests/e2e/space-browser.spec.ts','--project=desktop','--workers=1','--retries=0','--grep=continuous sound \\(native\\)$','--reporter=list,json,html'],{stdio:'inherit',env:{...Object.fromEntries(Object.entries(process.env).filter(([key])=>!/(?:^|_)proxy$/i.test(key))),NO_PROXY:'localhost,127.0.0.1,::1',SITE_OUTPUT_DIR:path.join(bundleRoot,'public'),SITE_BASE_PATH:base.pathname,SITE_CANONICAL_ORIGIN:base.origin,SITE_TEST_RESULTS:path.join(here,'results'),PLAYWRIGHT_HTML_OUTPUT_DIR:path.join(here,'html'),PLAYWRIGHT_HTML_OPEN:'never',PLAYWRIGHT_JSON_OUTPUT_FILE:path.join(here,'playwright-results.json')}});
              const row={index:index+1,variant,exitCode:result.status,processDurationMs:Date.now()-started,configHash:createHash('sha256').update(config).digest('hex')};runs.push(row);console.log('TRACE_COMPARE_END',JSON.stringify(row));
              if(result.error)throw result.error;
            }
          } finally {
            fs.writeFileSync(file,before);verifyFrozenProof({bundleRoot,plan,changeSet,proof});
            fs.writeFileSync(path.join(output,'identity.json'),JSON.stringify({diagnosticOnly:true,releaseEligible:false,source,run:process.env.DIAG_RUN,artifact:process.env.DIAG_ARTIFACT,order:variants,runs,node:process.version,playwright:JSON.parse(fs.readFileSync('node_modules/@playwright/test/package.json','utf8')).version},null,2));
          }
          if(runs.some(row=>row.exitCode!==0))process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trace-compare-${{ github.run_id }}
          path: tests/.artifacts/trace-compare/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
