name: Blog checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required blog quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Install only the content check tools
        run: |
          npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund
          ln -s tools/ci/node_modules node_modules
      - name: Check changed sources without building the site or starting browsers
        run: node scripts/ci-light.mjs
