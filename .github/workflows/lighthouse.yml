# Disposable diagnostic branch only; never merge into main or PR492.
name: Frozen browser GPU flags A/B diagnostic
on:
  workflow_dispatch:
    inputs:
      candidate_test_ref:
        description: Root-reviewed full 40-character candidate test commit, already published
        type: string
        required: true
      approved_test_paths:
        description: Root-approved exact changed test paths as a JSON array
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-browser-gpu-flags-ab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'cubxxw/blog' && github.ref_name == 'codex/blog-room-gpu-flags-ab-20261029' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install the shared locked test runtime without building the site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps --no-shell chromium
      - name: Download the exact failed-run frozen producer
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '12853140594'
          github-token: ${{ github.token }}
          repository: cubxxw/blog
          run-id: '40770044977'
          path: tests/.artifacts/frozen-ab-input
          merge-multiple: true
      - name: Compare explicit software GPU flags then original flags in six desktop cases
        env:
          CANDIDATE_TEST_REF: ${{ inputs.candidate_test_ref }}
          APPROVED_TEST_PATHS: ${{ inputs.approved_test_paths }}
        run: node scripts/diagnostics/frozen-browser-ab.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-frozen-gpu-flags-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/frozen-gpu-flags-ab-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
