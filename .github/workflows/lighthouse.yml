# DIAGNOSTIC BRANCH ONLY. Never merge this workflow into main or PR491.
name: Lighthouse Projects Linux diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-projects-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'cubxxw/blog' && github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/blog-lighthouse-diag-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install locked browser and original collector
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          npm install --prefix .lh-diagnostic-tools --ignore-scripts --no-audit --no-fund @lhci/cli@0.15.1
      - name: Collect two source-bound diagnostic samples without publishing
        run: node scripts/diagnostics/projects-linux.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-projects-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux-projects-diagnostic/
          if-no-files-found: error
          retention-days: 14
