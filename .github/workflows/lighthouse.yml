name: Lighthouse CI

on:
  push:
    branches: ["main"]
  # Daily at 07:30 UTC (15:30 Beijing), just after seo-analyze, so both
  # reporters land in the same daily issue.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two pushes in quick succession would otherwise race to write the same
  # section of the same issue. Queue instead of cancelling: a cancelled run
  # could leave the daily issue without a Lighthouse section at all.
  group: lighthouse
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    outputs:
      # Frozen ONCE per run (UTC report date): the publisher below shares it,
      # so a run crossing midnight keeps one daily-issue identity.
      report_date: ${{ steps.date.outputs.report_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Freeze UTC report date
        id: date
        run: echo "report_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install @lhci/cli
        run: npm install -g @lhci/cli

      # Netlify rebuilds on every push to main; wait it out so lhci scans the
      # freshly deployed HTML instead of the previous revision.
      - name: Wait for Netlify to publish this commit
        if: github.event_name == 'push'
        run: |
          echo "Waiting 120s for Netlify to publish ${GITHUB_SHA}…"
          sleep 120

      # Per-push quality gate preserved (lighthouserc.json assertions unchanged).
      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Minimal B2 publication integration: a small dedicated publish job in the
  # SHARED daily-report-publish serialization group (running publishes are
  # never cancelled). Measurement work stays parallel; publication writes the
  # daily issue with the run's frozen UTC date, resolves LHR details only
  # artifact-locally and publishes an honest missing-evidence section with a
  # nonzero exit when no eligible measurement exists. Push runs never write
  # the issue (reporting on every push buried the old tracker).
  publish:
    needs: lighthouse
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: daily-report-publish
      cancel-in-progress: false
    steps:
      - name: Checkout (fresh, no persisted credentials)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Lighthouse results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: lighthouse-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lighthouseci/

      - name: Sync report to daily issue (frozen UTC date)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/lighthouse-report-to-issue.mjs --date "${{ needs.lighthouse.outputs.report_date }}"
