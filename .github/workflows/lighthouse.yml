# DIAGNOSTIC BRANCH ONLY. Never merge this workflow into main or PR491.
name: Projects Linux GPU backend probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-projects-gpu-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'cubxxw/blog' && github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/blog-lighthouse-gpu-probe-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install locked browser and pinned launch stack
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          npm install --prefix .lh-diagnostic-tools --ignore-scripts --no-audit --no-fund @lhci/cli@0.15.1 lighthouse@12.6.1 chrome-launcher@1.2.2
      - name: Probe two fresh full-Chrome backend configurations without Lighthouse
        run: node scripts/diagnostics/projects-linux-gpu.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-projects-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux-projects-gpu-probe/
          if-no-files-found: error
          retention-days: 14
