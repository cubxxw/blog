name: Lighthouse CI
on:
  push:
    branches:
      - main
  schedule:
    - cron: 30 7 * * *
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Save additional traces for the two Chinese landing pages
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      release_context_artifact_id:
        type: string
        required: false
        default: ""
      dry_run:
        type: boolean
        required: false
        default: false
    secrets:
      LHCI_GITHUB_APP_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: lighthouse
  cancel-in-progress: false
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    outputs:
      report_date: ${{ steps.date.outputs.report_date }}
      lighthouse_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Freeze UTC report date
        id: date
        run: echo "report_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Install pinned Lighthouse runner
        run: |
          npx --no-install playwright install --with-deps --no-shell chromium
          LHCI_RUNTIME_PREFIX="$RUNNER_TEMP/blog-lhci-0.15.1"
          npm install --prefix "$LHCI_RUNTIME_PREFIX" --ignore-scripts --no-audit --no-fund @lhci/cli@0.15.1 lighthouse@12.6.1 chrome-launcher@1.2.2
          export LHCI_RUNTIME_PREFIX
          node <<'JS'
          const fs = require('node:fs'), path = require('node:path');
          const { createHash } = require('node:crypto');
          const { createRequire } = require('node:module');
          const { spawnSync } = require('node:child_process');
          const tools = createRequire(path.join(process.env.LHCI_RUNTIME_PREFIX, 'package.json'));
          const collectorRequire = createRequire(tools.resolve('@lhci/cli/src/collect/node-runner.js'));
          const lighthouseEntry = collectorRequire.resolve('lighthouse');
          const lighthouseRequire = createRequire(lighthouseEntry);
          const launcher = JSON.parse(fs.readFileSync(path.join(path.dirname(lighthouseRequire.resolve('chrome-launcher')), '..', 'package.json')));
          const chromePath = require('playwright').chromium.executablePath();
          const browser = spawnSync(chromePath, ['--version'], { encoding: 'utf8' });
          const versions = { node: process.versions.node, playwright: require('playwright/package.json').version,
            cli: tools('@lhci/cli/package.json').version, lighthouse: collectorRequire('lighthouse/package.json').version,
            chromeLauncher: launcher.version, chrome: (browser.stdout || '').trim() };
          const expected = { node: '22.23.1', playwright: '1.64.1', cli: '0.15.1', lighthouse: '12.6.1',
            chromeLauncher: '1.2.2', chrome: 'Google Chrome for Testing 156.0.8078.4' };
          const bytes = fs.readFileSync('lighthouserc.json'), config = JSON.parse(bytes);
          const flags = [config.ci.collect.settings.chromeFlags, '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'].join(' ');
          const verified = browser.status === 0 && launcher.name === 'chrome-launcher' && Object.entries(expected).every(([key, value]) => versions[key] === value);
          fs.mkdirSync('.lighthouseci', { recursive: true });
          fs.writeFileSync('.lighthouseci/runner-receipt.json', JSON.stringify({ schema: 'lighthouse-runner/1', verified,
            collectorSourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            observedAt: new Date().toISOString(), versions, launcherResolvedFrom: 'LHCI NodeRunner -> lighthouse',
            configSha256: createHash('sha256').update(bytes).digest('hex'),
            assertionSha256: createHash('sha256').update(JSON.stringify(config.ci.assert)).digest('hex'),
            urlCount: config.ci.collect.url.length, numberOfRuns: config.ci.collect.numberOfRuns,
            effectiveChromeFlags: flags, sourceScope: 'Collector checkout; public release consistency is checked separately.' }, null, 2));
          if (!verified) throw new Error('Lighthouse runner version mismatch; see runner-receipt.json');
          const environment = { CHROME_PATH: chromePath, LHCI_RUNTIME_CLI: tools.resolve('@lhci/cli/src/cli.js'),
            LH_DIAG_CLI: path.join(path.dirname(lighthouseEntry), '..', 'cli', 'index.js'), LH_CHROME_FLAGS: flags };
          for (const [key, value] of Object.entries(environment)) {
            if (/[\r\n]/.test(value)) throw new Error('Invalid runner environment value');
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          JS
      - name: Wait for Netlify to publish this commit
        if: github.event_name == 'push' && inputs.release_context_artifact_id == ''
        run: |
          echo "Waiting 120s for Netlify to publish ${GITHUB_SHA}…"
          sleep 120
      - name: Download verified same-run release context
        if: inputs.release_context_artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.release_context_artifact_id }}
          path: followups
          merge-multiple: true
      - name: Confirm the public release before side effects
        id: release
        if: inputs.release_context_artifact_id != ''
        run: node scripts/release-followups.mjs assert-current --context followups/release-context.json --out .lighthouseci/release-check-before.json
      - name: Run Lighthouse CI
        id: measure
        # https://github.com/GoogleChrome/lighthouse-ci/blob/v0.15.1/docs/configuration.md#autorun
        run: node "$LHCI_RUNTIME_CLI" autorun --collect.chromePath="$CHROME_PATH" --collect.settings.chromeFlags="$LH_CHROME_FLAGS"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Capture opt-in first-paint diagnostic traces
        if: github.event_name == 'workflow_dispatch' && inputs.diagnostics == true && steps.measure.outcome == 'success'
        run: |
          mkdir -p .lighthouseci/diagnostics
          test -f "$LH_DIAG_CLI"
          node "$LH_DIAG_CLI" --help > .lighthouseci/diagnostics/help.txt
          node -e 'if (!require("node:fs").readFileSync(".lighthouseci/diagnostics/help.txt","utf8").includes("--save-assets")) process.exit(1)'
          for section in growth ai-agent; do
            node "$LH_DIAG_CLI" "https://cubxxw.com/zh/$section/" \
              --save-assets --output=json --output-path=".lighthouseci/diagnostics/zh-$section.json" \
              --chrome-flags="--headless=new $LH_CHROME_FLAGS" \
              --no-enable-error-reporting
          done
          printf '%s\n' "$GITHUB_SHA" > .lighthouseci/diagnostics/source-sha.txt
      - name: Check release consistency after measurement
        if: always() && inputs.release_context_artifact_id != ''
        run: |
          if node scripts/release-followups.mjs assert-current --context followups/release-context.json --out .lighthouseci/release-check-after.json; then
            exit 0
          fi
          if [ -f .lighthouseci/manifest.json ]; then mv .lighthouseci/manifest.json .lighthouseci/manifest.inconsistent.json; fi
          exit 1
      - name: Upload Lighthouse results
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
    if: github.repository == 'cubxxw/blog' && (((vars.BLOG_RELEASE_MODE == '' || vars.BLOG_RELEASE_MODE == 'shadow') && (inputs.release_context_artifact_id == '' || inputs.dry_run == true)) || (vars.BLOG_RELEASE_MODE == 'active' && vars.BLOG_FOLLOWUPS_ENABLED == 'true' && inputs.release_context_artifact_id != ''))
  publish:
    needs: lighthouse
    if: always() && github.event_name != 'push' && needs.lighthouse.result != 'skipped' && inputs.dry_run != true && needs.lighthouse.outputs.lighthouse_artifact_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: daily-report-publish
      cancel-in-progress: false
    steps:
      - name: Checkout (fresh, no persisted credentials)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Lighthouse results
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.lighthouse.outputs.lighthouse_artifact_id }}
          path: .lighthouseci/
      - name: Sync report to daily issue (frozen UTC date)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/lighthouse-report-to-issue.mjs --date "${{ needs.lighthouse.outputs.report_date }}"
