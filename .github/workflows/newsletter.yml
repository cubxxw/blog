name: Newsletter Send
on:
  push:
    branches:
      - main
    paths:
      - content/**
  schedule:
    - cron: 0 13 * * *
  workflow_dispatch:
    inputs:
      mode:
        description: draft (review in dashboard) or send (automatic)
        type: choice
        options:
          - draft
          - send
        default: draft
      dry_run:
        description: Dry run — log what would happen, send nothing
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_context_artifact_id:
        type: string
        required: false
        default: ""
      dry_run:
        type: boolean
        required: false
        default: false
      mode:
        type: string
        required: false
        default: ""
    secrets:
      BUTTONDOWN_API_KEY:
        required: false
permissions:
  contents: write
concurrency:
  group: newsletter-send
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test newsletter integration
        run: npm run newsletter:test
      - name: Wait for deploy to propagate (push runs only)
        if: github.event_name == 'push' && inputs.release_context_artifact_id == ''
        run: |
          echo "Giving Netlify time to publish the new post into the feed..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://cubxxw.com/zh/index.xml")
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 10
          done
          # The feed being 200 doesn't prove the NEW post is in it — the
          # daily cron is the safety net for deploy races.
          sleep 120
      - name: Download verified same-run release context
        if: inputs.release_context_artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.release_context_artifact_id }}
          path: followups
          merge-multiple: true
      - name: Confirm the public release before side effects
        id: release
        if: inputs.release_context_artifact_id != ''
        run: node scripts/release-followups.mjs assert-current --context followups/release-context.json --out followups/public-check-before.json
      - name: Send newsletter
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_MODE: ${{ inputs.mode || vars.NEWSLETTER_MODE || 'draft' }}
          NEWSLETTER_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_CONTEXT_ID: ${{ inputs.release_context_artifact_id }}
          VERIFIED_FEED_BASE: ${{ steps.release.outputs.feed_base_url }}
        run: |
          args=(--state-persistence=git)
          if [ "$NEWSLETTER_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$RELEASE_CONTEXT_ID" ]; then args+=(--release-context followups/release-context.json --feed-base-url "$VERIFIED_FEED_BASE"); fi
          node scripts/newsletter-send.mjs "${args[@]}"
    if: github.repository == 'cubxxw/blog' && (((vars.BLOG_RELEASE_MODE == '' || vars.BLOG_RELEASE_MODE == 'shadow') && (inputs.release_context_artifact_id == '' || inputs.dry_run == true)) || (vars.BLOG_RELEASE_MODE == 'active' && vars.BLOG_FOLLOWUPS_ENABLED == 'true' && inputs.release_context_artifact_id != ''))
