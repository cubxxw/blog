name: Publish static Pages backup (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full SHA of a main revision containing backup tooling
        type: string
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Select a supported main revision
        id: revision
        env:
          BACKUP_SHA: ${{ inputs.source_sha }}
        run: |
          sha="${BACKUP_SHA:-$(git rev-parse HEAD)}"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'Full commit SHA required'; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main
          git cat-file -e "$sha:config/ci-toolchain.json"
          git checkout --detach "$sha"
          git submodule update --init --recursive
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
        id: pages
      - uses: ./.github/actions/setup-blog
      - name: Validate and build the separate backup target
        env:
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/ci-changes.mjs --head "$SOURCE_SHA" --out tests/.artifacts/backup-changes.json
          node scripts/check-content-quality.mjs source --change-set tests/.artifacts/backup-changes.json --out tests/.artifacts/backup-source-report.json
          node scripts/site-build.mjs --target backup --sha "$SOURCE_SHA" --clock "$(date -u +%FT%TZ)" --base-url "$PAGES_URL/" --out tests/.artifacts/pages
          node scripts/site-verify.mjs --public-dir tests/.artifacts/pages/public --page-map tests/.artifacts/pages/page-map.json --change-set tests/.artifacts/backup-changes.json --report-dir tests/.artifacts/pages-report
          node scripts/check-generated-seo.mjs --public-dir tests/.artifacts/pages/public --target backup
      - uses: actions/upload-pages-artifact@v5
        with:
          path: tests/.artifacts/pages/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
