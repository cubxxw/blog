name: SEO Analyze

on:
  schedule:
    # Daily at 07:00 UTC (15:00 Beijing), one hour after seo-snapshot so the
    # committed gsc-/psi-/crux observations are on main.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-analyze
  cancel-in-progress: false

jobs:
  # Minimal identity freeze BEFORE any fragile preparation: one UTC report
  # date + evidence cutoff shared by every later job through job outputs.
  context:
    runs-on: ubuntu-latest
    outputs:
      report_date: ${{ steps.ctx.outputs.report_date }}
      as_of: ${{ steps.ctx.outputs.decision_at }}
      window_start: ${{ steps.ctx.outputs.window_start }}
      window_end: ${{ steps.ctx.outputs.window_end }}
    steps:
      - name: Checkout (fresh, no persisted credentials)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Freeze run context (UTC report date + evidence cutoff)
        id: ctx
        run: |
          mkdir -p run
          node scripts/seo-pipeline.mjs freeze \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --out run/run-context.json \
            --github-output "$GITHUB_OUTPUT"

  # Trusted preparation: deterministic evidence only — the versioned report
  # and the bounded PUBLIC-SAFE prompt (no raw GSC query strings — the action
  # logs the prompt unconditionally).
  prepare:
    needs: context
    runs-on: ubuntu-latest
    env:
      AS_OF: ${{ needs.context.outputs.as_of }}
      RUN_DATE: ${{ needs.context.outputs.report_date }}
      WIN_START: ${{ needs.context.outputs.window_start }}
      WIN_END: ${{ needs.context.outputs.window_end }}
    outputs:
      prompt: ${{ steps.prompt.outputs.prompt }}
    steps:
      - name: Checkout (fresh, no persisted credentials)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Generate deterministic report
        id: report
        run: |
          set +e
          node scripts/seo-report.mjs --dir data/seo \
            --start "$WIN_START" --end "$WIN_END" \
            --as-of "$AS_OF" --run-date "$RUN_DATE" \
            --out run/report.json --markdown-out run/section.md
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate report stage (generated vs failed; fresh vs degraded)
        if: always()
        run: |
          node scripts/seo-pipeline.mjs report \
            --exit-code "${{ steps.report.outputs.code || '1' }}" \
            --report run/report.json --markdown run/section.md \
            --expect-as-of "$AS_OF" --expect-run-date "$RUN_DATE" \
            --expect-start "$WIN_START" --expect-end "$WIN_END" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --attempt "$GITHUB_RUN_ATTEMPT" --report-date "$RUN_DATE" \
            --out run/stage-report.json

      - name: Build bounded public-safe interpretation prompt
        id: prompt
        run: |
          node scripts/seo-pipeline.mjs prompt --report run/report.json \
            --repository "$GITHUB_REPOSITORY" --run-date "$RUN_DATE" --as-of "$AS_OF" \
            --out run/prompt.txt
          {
            echo 'prompt<<PROMPT_EOF'
            cat run/prompt.txt
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload prepared evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/**
          retention-days: 14
          if-no-files-found: warn

  # Optional interpretation: tool-free, read-only, bounded. The verified action
  # boundary (docs/seo-model-boundary-proof.json) is appended verbatim; its own
  # read-only github.token is supplied explicitly so the action's optional
  # GitHub App token flow never provides a broader token. No Google or
  # publisher write token exists here. Structured output is consumed through
  # the environment by trusted code — never interpolated into shell source.
  interpret:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (fresh, no persisted credentials)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Optional bounded explanation (model, no tools)
        id: model
        continue-on-error: true
        uses: anthropics/claude-code-action@v1.0.231
        env:
          # ACTIONS_STEP_DEBUG=true would override show_full_output=false in
          # the current parser; force false AT action execution.
          ACTIONS_STEP_DEBUG: "false"
        with:
          prompt: ${{ needs.prepare.outputs.prompt }}
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "false"
          display_report: "false"
          claude_args: |
            --tools= --disallowedTools "mcp__*" --strict-mcp-config --mcp-config '{"mcpServers":{}}' --safe-mode --disable-slash-commands --json-schema '{"type":"object","properties":{"explanation":{"type":"string","minLength":1,"maxLength":600}},"required":["explanation"],"additionalProperties":false}' --max-turns 2

      - name: Record interpretation (allowlisted sanitized diagnostics only)
        if: always()
        env:
          STRUCTURED_OUTPUT: ${{ steps.model.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.model.outputs.execution_file }}
        run: |
          mkdir -p run
          node scripts/seo-pipeline.mjs interpretation \
            --action-outcome "${{ steps.model.outcome }}" \
            --conclusion "${{ steps.model.outputs.conclusion }}" \
            --structured-output-env STRUCTURED_OUTPUT \
            --execution-file "$EXECUTION_FILE" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --out run/interpretation.json

      # The sanitized record ONLY: raw execution files are never uploaded.
      - name: Upload interpretation record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-interpretation-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/interpretation.json
          retention-days: 14
          if-no-files-found: warn

  # Trusted publication: fresh checkout at the run's frozen SHA, regenerates
  # the deterministic evidence, appends at most a literal bounded optional
  # paragraph (withheld on failure) and writes the shared daily issue section.
  # A publish failure is never green.
  publish:
    needs: [context, prepare, interpret]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: daily-report-publish
      cancel-in-progress: false
    env:
      AS_OF: ${{ needs.context.outputs.as_of }}
      RUN_DATE: ${{ needs.context.outputs.report_date }}
      WIN_START: ${{ needs.context.outputs.window_start }}
      WIN_END: ${{ needs.context.outputs.window_end }}
    steps:
      - name: Checkout (fresh at the frozen SHA, no persisted credentials)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Ensure output directory
        run: mkdir -p run

      - name: Download interpretation record (optional)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: seo-interpretation-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/

      - name: Regenerate deterministic evidence
        id: report
        run: |
          set +e
          node scripts/seo-report.mjs --dir data/seo \
            --start "$WIN_START" --end "$WIN_END" \
            --as-of "$AS_OF" --run-date "$RUN_DATE" \
            --out run/report.json --markdown-out run/section.md
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate regenerated report stage
        if: always()
        run: |
          node scripts/seo-pipeline.mjs report \
            --exit-code "${{ steps.report.outputs.code || '1' }}" \
            --report run/report.json --markdown run/section.md \
            --expect-as-of "$AS_OF" --expect-run-date "$RUN_DATE" \
            --expect-start "$WIN_START" --expect-end "$WIN_END" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --attempt "$GITHUB_RUN_ATTEMPT" --report-date "$RUN_DATE" \
            --out run/stage-report.json

      - name: Aggregate pre-publication status
        if: always()
        run: |
          if [ -f run/interpretation.json ]; then INTERP_ARG="--interpretation run/interpretation.json"; else INTERP_ARG=""; fi
          node scripts/seo-pipeline.mjs aggregate \
            --stage run/stage-report.json $INTERP_ARG \
            --out run/status.json

      - name: Compose SEO section (deterministic first; model text literal/withheld)
        if: always()
        run: |
          if [ -f run/report.json ]; then REPORT_ARG="--report run/report.json"; else REPORT_ARG=""; fi
          if [ -f run/interpretation.json ]; then INTERP_ARG="--interpretation run/interpretation.json"; else INTERP_ARG=""; fi
          node scripts/seo-pipeline.mjs compose --kind seo $REPORT_ARG $INTERP_ARG \
            --status run/status.json --run-date "$RUN_DATE" --as-of "$AS_OF" \
            --out run/section-final.md

      - name: Publish SEO section to the daily issue
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          node scripts/seo-section-to-issue.mjs run/section-final.md --date "$RUN_DATE"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record publish stage
        if: always()
        run: |
          node scripts/seo-pipeline.mjs stage --kind publish \
            --exit-code "${{ steps.publish.outputs.code || '1' }}" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --attempt "$GITHUB_RUN_ATTEMPT" --report-date "$RUN_DATE" \
            --out run/stage-publish.json

      - name: Final required-stage status
        if: always()
        run: |
          if [ -f run/interpretation.json ]; then INTERP_ARG="--interpretation run/interpretation.json"; else INTERP_ARG=""; fi
          node scripts/seo-pipeline.mjs aggregate \
            --stage run/stage-report.json \
            --stage run/stage-publish.json $INTERP_ARG \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --attempt "$GITHUB_RUN_ATTEMPT" --report-date "$RUN_DATE" \
            --out run/status-final.json

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/**
          retention-days: 14
          if-no-files-found: warn
