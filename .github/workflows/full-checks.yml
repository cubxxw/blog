name: Full blog diagnostics (manual)

# Explicit diagnostics only. Netlify Git builds publish production.
on:
  workflow_dispatch:
    inputs:
      room_regressions:
        description: Include the additional room regression diagnostics
        type: boolean
        default: false

permissions:
  contents: read

env:
  BLOG_RELEASE_MODE: shadow

# A newer manual diagnostic on the same ref supersedes an older one.
concurrency:
  group: blog-full-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Freeze production bytes and verify offline contracts
    # Keep the build and browser host stable while ubuntu-latest migrates.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      run_site: ${{ steps.plan.outputs.run_site }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      artifact_id: ${{ steps.frozen.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
      - name: Freeze scope and build clock
        id: plan
        run: node scripts/ci-run.mjs plan
      - uses: ./.github/actions/setup-blog
        with:
          browsers: ${{ steps.plan.outputs.browser_engines }}
      - name: Enforce offline checks and build one frozen production bundle
        run: node scripts/ci-run.mjs prepare
      - name: Verify reusable author audio
        run: npm run voice:test
      - name: Verify BEAR OS tool and media boundaries
        run: |
          npm run bear:test
          node --test --test-concurrency=1 scripts/space-preload.test.mjs scripts/space-boot-stages.test.mjs
      - name: Verify public interaction and AI rendering contracts
        run: npm run ux:test
      - name: Upload frozen verification input (not a releasable artifact)
        id: frozen
        uses: actions/upload-artifact@v7
        with:
          name: blog-frozen-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.artifacts/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve offline failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blog-prepare-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/ci/
            tests/.artifacts/door-preflight/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  preflight:
    name: Exercise room journeys on the frozen producer
    needs: [prepare]
    if: needs.prepare.outputs.run_site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    env:
      BLOG_PRODUCER_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
      BLOG_ROOM_REGRESSIONS: ${{ inputs.room_regressions == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-blog
        with:
          browsers: chromium
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: tests/.artifacts/ci
          merge-multiple: true
      - name: Bind the exact producer before any browser input
        run: node scripts/ci-preflight-receipt.mjs start
      - name: Diagnose the desktop rear-door journey before browser fan-out
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          import {verifyFrozenProof} from './scripts/ci-shards.mjs';
          const dir=path.resolve('tests/.artifacts/ci'),bundleRoot=path.join(dir,'site');
          const read=name=>JSON.parse(fs.readFileSync(path.join(dir,name),'utf8'));
          const plan=read('plan.json'),changeSet=read('changes.json'),proof=read('frozen.json');
          const base=new URL(JSON.parse(fs.readFileSync(path.join(bundleRoot,'page-map.json'),'utf8')).baseUrl);
          const evidence=path.resolve('tests/.artifacts/door-preflight');
          verifyFrozenProof({bundleRoot,plan,changeSet,proof});
          const result=spawnSync(process.execPath,[
            'node_modules/@playwright/test/cli.js','test','tests/e2e/space-door-excursion.spec.ts',
            '--project=desktop','--workers=1','--retries=0','--repeat-each=3','--reporter=list,json,html',
            '--grep=1440px / no-preference.*the real rear door, deliberate step, splash and safe return form one repeatable journey'
          ],{stdio:'inherit',env:{
            ...Object.fromEntries(Object.entries(process.env).filter(([key])=>!/(?:^|_)proxy$/i.test(key))),
            NO_PROXY:'localhost,127.0.0.1,::1',SITE_OUTPUT_DIR:path.join(bundleRoot,'public'),
            SITE_BASE_PATH:base.pathname,SITE_CANONICAL_ORIGIN:base.origin,
            SITE_TEST_RESULTS:path.join(evidence,'results'),PLAYWRIGHT_HTML_OUTPUT_DIR:path.join(evidence,'html'),
            PLAYWRIGHT_JSON_OUTPUT_FILE:path.join(evidence,'playwright-results.json')
          }});
          verifyFrozenProof({bundleRoot,plan,changeSet,proof});
          if(result.error)throw result.error;
          process.exitCode=result.status??1;
          NODE
      - name: Diagnose known room regressions before browser fan-out
        if: inputs.room_regressions == true
        run: node scripts/ci-room-preflight.mjs
      - name: Certify raw preflight results on the same producer
        run: node scripts/ci-preflight-receipt.mjs finish
      - name: Preserve original preflight evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blog-preflight-${{ github.run_id }}-${{ needs.prepare.outputs.artifact_id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/ci/preflight-input.json
            tests/.artifacts/ci/preflight-door-list.json
            tests/.artifacts/ci/preflight-report.json
            tests/.artifacts/ci/frozen.json
            tests/.artifacts/ci/plan.json
            tests/.artifacts/ci/room-preflight/
            tests/.artifacts/door-preflight/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser ${{ matrix.id }}
    needs: [prepare, preflight]
    if: needs.prepare.outputs.run_site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-blog
        with:
          browsers: ${{ matrix.project || 'chromium' }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: tests/.artifacts/ci
          merge-multiple: true
      - name: Verify one partition on the exact frozen bytes
        env:
          BLOG_SHARD_ID: ${{ matrix.id }}
        run: node scripts/ci-run.mjs browser-shard --shard-id "$BLOG_SHARD_ID"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Bind all attempts to the exact producer artifact, not a consumer's
          # run_attempt. The aggregator selects the latest result per shard.
          name: blog-browser-${{ github.run_id }}-${{ needs.prepare.outputs.artifact_id }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/ci/shard/
            playwright-report/interactive/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Full blog diagnostics
    needs: [prepare, preflight, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: blog-verify-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      publish: ${{ needs.prepare.outputs.publish }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      manifest_digest: ${{ steps.verify.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Reject incomplete or unsuccessful required jobs
        env:
          BLOG_PREPARE_RESULT: ${{ needs.prepare.result }}
          BLOG_PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BLOG_BROWSER_RESULT: ${{ needs.browser.result }}
          BLOG_RUN_SITE: ${{ needs.prepare.outputs.run_site }}
        run: >-
          node --input-type=module -e 'import {assertVerificationJobs} from "./scripts/ci-shards.mjs";
          assertVerificationJobs({prepare:process.env.BLOG_PREPARE_RESULT,preflight:process.env.BLOG_PREFLIGHT_RESULT,browser:process.env.BLOG_BROWSER_RESULT,runSite:process.env.BLOG_RUN_SITE==="true"});'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: tests/.artifacts/ci
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.run_site == 'true'
        with:
          pattern: blog-browser-${{ github.run_id }}-${{ needs.prepare.outputs.artifact_id }}-*
          path: tests/.artifacts/ci/shard-downloads
          merge-multiple: false
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.run_site == 'true'
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id }}
          path: tests/.artifacts/ci/preflight-download
          merge-multiple: true
      - name: Aggregate every required partition and verify frozen identity
        id: verify
        env:
          BLOG_PRODUCER_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          BLOG_ROOM_REGRESSIONS: ${{ inputs.room_regressions == true }}
        run: node scripts/ci-run.mjs finalize
      - name: Upload the verified deployment bundle
        id: artifact
        if: needs.prepare.outputs.run_site == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: blog-site-${{ github.sha }}-${{ github.run_attempt }}
          path: tests/.artifacts/ci/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve final verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blog-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/.artifacts/ci/*-report.json
            tests/.artifacts/ci/site/*-report.json
            tests/.artifacts/ci/changes.json
            tests/.artifacts/ci/plan.json
            tests/.artifacts/ci/frozen.json
          if-no-files-found: warn
          retention-days: 7
