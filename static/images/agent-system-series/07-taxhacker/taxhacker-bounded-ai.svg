<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="257.5" y="323">Receipt / invoice / PDF</tspan><tspan x="257.5" y="344.6"></tspan><tspan x="257.5" y="366.2">image previews</tspan><tspan x="257.5" y="387.8">+ user prompts</tspan></text>
<text fill="#c43d2b" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="257.5" y="542">只分析前 4 页</tspan><tspan x="257.5" y="562.4">上传文件与预览仍含</tspan><tspan x="257.5" y="582.8">金融数据 / PII</tspan></text>
<text fill="#695b83" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="700" text-anchor="start" opacity="1"><tspan x="530" y="225">LLM extraction · 配置顺序 fallback，不是投票</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="725" y="321">Provider A · configured first</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="725" y="431">Provider B · if A errors</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="725" y="541">Provider C · if B errors</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="725" y="700">temperature = 0 · first success wins</tspan><tspan x="725" y="720.4">OpenAI / Google / Mistral: structured output</tspan><tspan x="725" y="740.8">compatible: JSON.parse only</tspan></text>
<text fill="#76510e" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="16" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1028" y="394">SCHEMA</tspan><tspan x="1028" y="413.2">NARROW</tspan><tspan x="1028" y="432.4">WAIST</tspan><tspan x="1028" y="451.6"></tspan><tspan x="1028" y="470.8">required</tspan><tspan x="1028" y="490">+ no extra</tspan><tspan x="1028" y="509.2"></tspan><tspan x="1028" y="528.4">compatible</tspan><tspan x="1028" y="547.6">path gap</tspan><tspan x="1028" y="566.8"></tspan><tspan x="1028" y="586">形状 ≠ 事实</tspan></text>
<text fill="#3f654d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="700" text-anchor="start" opacity="1"><tspan x="1125" y="225">事实与金融写入边界</tspan></text>
