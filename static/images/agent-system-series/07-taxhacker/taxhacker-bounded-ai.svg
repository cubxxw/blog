<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1327.5" y="459">Zod form validation</tspan><tspan x="1327.5" y="479.4">类型 / 长度 / 日期 / 金额转分</tspan><tspan x="1327.5" y="499.8">仍不证明来源正确</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1327.5" y="604">Duplicate candidate check</tspan><tspan x="1327.5" y="624.4">keep both / replace / cancel</tspan><tspan x="1327.5" y="644.8">不是通用会计对账</tspan></text>
<text fill="#c43d2b" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1327.5" y="748">显式 Save as Transaction</tspan></text>
<text fill="#76510e" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1015" y="934">两个状态必须分开：模型候选可缓存，canonical record 只能经应用动作写入</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="715" y="984">File.cachedParseResult</tspan><tspan x="715" y="1004.4">可重开表单 · 可被纠正</tspan><tspan x="715" y="1024.8">不是会计事实源</tspan></text>
<text fill="#76510e" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1317.5" y="984">Postgres Transaction</tspan><tspan x="1317.5" y="1004.4">user-scoped canonical record</tspan><tspan x="1317.5" y="1024.8">保留原文件关联</tspan></text>
<text fill="#66625c" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="820" y="1137">当不确定性可以收缩为 extraction(input) → candidate output，成熟设计应把控制流留给应用 · schema-valid 只证明结构可解析 · provider fallback 只证明可用性</tspan></text>
