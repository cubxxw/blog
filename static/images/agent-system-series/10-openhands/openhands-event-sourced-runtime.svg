<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 16 1624 1219" width="1624" height="1219">
<rect x="38" y="16" width="1624" height="1219" fill="#faf9f7" />
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="36" font-weight="700" text-anchor="start" opacity="1"><tspan x="70" y="84">OpenHands V1 · Conversation as Database</tspan></text>
<text fill="#66625c" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="72" y="132">无状态 step 读取事件投影、提出 action；Conversation 持久化内部事实，但外部副作用仍需要幂等与对账</tspan></text>
<rect x="70" y="190" width="1115" height="770" rx="8" fill="#dcebf4" stroke="#58788a" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.34" />
<text fill="#385d70" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="start" opacity="1"><tspan x="95" y="224">CONVERSATION BOUNDARY · lifecycle、event append、base state 与 active branch 的唯一协调者</tspan></text>
<rect x="105" y="280" width="270" height="150" rx="8" fill="#e7e0ef" stroke="#695b83" stroke-width="2" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#695b83" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="16" font-weight="700" text-anchor="middle" opacity="1"><tspan x="240" y="322">BASE STATE SNAPSHOT</tspan><tspan x="240" y="341.2">base_state.json</tspan><tspan x="240" y="360.4"></tspan><tspan x="240" y="379.6">status · stats · agent config</tspan><tspan x="240" y="398.8">agent_state · secrets metadata</tspan><tspan x="240" y="418">字段更新会覆盖保存</tspan></text>
<rect x="430" y="280" width="300" height="150" rx="8" fill="#dfece4" stroke="#5f7f6b" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#3f654d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="580" y="327">DERIVED ACTIVE VIEW</tspan><tspan x="580" y="347.4"></tspan><tspan x="580" y="367.8">path_to_root(leaf)</tspan><tspan x="580" y="388.2">增量 replay / branch rebuild</tspan><tspan x="580" y="408.6">只读缓存 · 不单独持久化</tspan></text>
<rect x="800" y="270" width="320" height="170" rx="8" fill="#f7e8bd" stroke="#9a6c17" stroke-width="4" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#76510e" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="960" y="319">STATELESS AGENT STEP</tspan><tspan x="960" y="340.6"></tspan><tspan x="960" y="362.2">读取 active event view</tspan><tspan x="960" y="383.8">condense → LLM → tool call</tspan><tspan x="960" y="405.4">自身不跨 step 持有可变状态</tspan></text>
<polyline points="730,355 800,355" fill="none" stroke="#5f7f6b" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="800,355 788,362 788,348" fill="#5f7f6b" />
<polyline points="580,590 580,430" fill="none" stroke="#5f7f6b" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="580,430 587,442 573,442" fill="#5f7f6b" />
<rect x="105" y="535" width="1010" height="220" rx="8" fill="#faf9f7" stroke="#58788a" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#385d70" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="start" opacity="1"><tspan x="125" y="570">APPEND-ONLY TYPED EVENT LOG · events/event-*.json · immutable Pydantic events</tspan></text>
<rect x="135" y="615" width="190" height="90" rx="8" fill="#dcebf4" stroke="#58788a" stroke-width="2" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<rect x="410" y="615" width="200" height="90" rx="8" fill="#f7e8bd" stroke="#9a6c17" stroke-width="2" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<rect x="695" y="615" width="220" height="90" rx="8" fill="#dfece4" stroke="#5f7f6b" stroke-width="2" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<rect x="965" y="615" width="120" height="90" rx="8" fill="#e7e0ef" stroke="#695b83" stroke-width="2" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="230" y="654">1 · MessageEvent</tspan><tspan x="230" y="674.4">source=user</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="510" y="654">2 · ActionEvent</tspan><tspan x="510" y="674.4">source=agent</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="805" y="654">3 · ObservationEvent</tspan><tspan x="805" y="674.4">source=environment</tspan></text>
<text fill="#695b83" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="15" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1025" y="642">state update</tspan><tspan x="1025" y="660">pause</tspan><tspan x="1025" y="678">condensation</tspan><tspan x="1025" y="696">error</tspan></text>
<polyline points="325,660 410,660" fill="none" stroke="#58788a" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="410,660 398,667 398,653" fill="#58788a" />
<polyline points="610,660 695,660" fill="none" stroke="#9a6c17" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="695,660 683,667 683,653" fill="#9a6c17" />
<polyline points="915,660 965,660" fill="none" stroke="#5f7f6b" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="965,660 953,667 953,653" fill="#5f7f6b" />
<polyline points="950,440 950,535 510,535 510,615" fill="none" stroke="#9a6c17" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="510,615 503,603 517,603" fill="#9a6c17" />
<text fill="#66625c" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="16" font-weight="400" text-anchor="middle" opacity="1"><tspan x="605" y="734">Event.source 记录来源；LLM role 只决定如何投影给模型。两者不能互相推断。</tspan></text>
<rect x="105" y="805" width="1010" height="115" rx="8" fill="#faf9f7" stroke="#58788a" stroke-width="2" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="610" y="847">ONE CONVERSATION API</tspan><tspan x="610" y="868.6">LocalConversation：同进程 + LocalWorkspace（直接 host access）</tspan><tspan x="610" y="890.2">RemoteConversation：HTTP + WebSocket → Agent Server + RemoteWorkspace（容器 / VM 隔离）</tspan></text>
<rect x="1230" y="190" width="400" height="770" rx="8" fill="#f7e8bd" stroke="#9a6c17" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" />
<text fill="#76510e" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1430" y="230">RUNTIME / SERVICE BOUNDARY</tspan><tspan x="1430" y="254">执行身体与外部世界</tspan></text>
<rect x="1280" y="305" width="300" height="120" rx="8" fill="#faf9f7" stroke="#9a6c17" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1430" y="347">Workspace</tspan><tspan x="1430" y="367.4">files · shell · processes</tspan><tspan x="1430" y="387.8"></tspan><tspan x="1430" y="408.2">mutable world state</tspan><tspan x="1430" y="428.6">不由 event replay 推导</tspan></text>
<rect x="1280" y="485" width="300" height="115" rx="8" fill="#f5d8d2" stroke="#c43d2b" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#c43d2b" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1430" y="525">External service</tspan><tspan x="1430" y="545.4">GitHub · API · ticket · payment</tspan><tspan x="1430" y="565.8"></tspan><tspan x="1430" y="586.2">irreversible / independently mutable</tspan></text>
<polyline points="1115,625 1205,625 1205,365 1280,365" fill="none" stroke="#9a6c17" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="1280,365 1268,372 1268,358" fill="#9a6c17" />
<polyline points="1115,675 1185,675 1185,543 1280,543" fill="none" stroke="#c43d2b" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="1280,543 1268,550 1268,536" fill="#c43d2b" />
<polyline points="1280,725 1185,725 1185,705 915,705" fill="none" stroke="#5f7f6b" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><polygon points="915,705 927,698 927,712" fill="#5f7f6b" />
<text fill="#3f654d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="16" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1420" y="776">tool result → ObservationEvent</tspan><tspan x="1420" y="795.2">只有 observation 落盘后，内部历史才知道执行结果</tspan></text>
<rect x="1260" y="835" width="340" height="95" rx="8" fill="#f5d8d2" stroke="#c43d2b" stroke-width="4" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" />
<text fill="#c43d2b" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1430" y="869">CRASH WINDOW</tspan><tspan x="1430" y="889.4">外部写入成功 → 进程崩溃</tspan><tspan x="1430" y="909.8">→ ObservationEvent 尚未追加</tspan></text>
<rect x="70" y="1010" width="1560" height="145" rx="8" fill="#dfece4" stroke="#5f7f6b" stroke-width="3" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
<text fill="#3f654d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="start" opacity="1"><tspan x="95" y="1044">MINIMUM RECOVERY PROTOCOL · event replay 只是第一步</tspan></text>
<text fill="#3f654d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="855" y="1087">1 读 base state + event log → 2 恢复 active branch / derived view → 3 找 orphan ActionEvent → 4 用 operation_id 查询外部世界 → 5 已成功则补 observation，未发生才重试 → 6 人工处理 unknown</tspan></text>
<text fill="#66625c" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="855" y="1192">Append-only log 能恢复 Agent 对过去的认识 · 不能撤销世界已经发生的变化 · optional isolation 也不会自动提供 exactly-once</tspan></text>
</svg>
