<text fill="#55798d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="start" opacity="1"><tspan x="95" y="219">互联网输入 · 不可信内容边界</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="257.5" y="308">Telegram · account A</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="257.5" y="403">Slack · workspace B</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="257.5" y="494">Mail / Web / Docs</tspan><tspan x="257.5" y="514.4">内容可携带 prompt injection</tspan></text>
<text fill="#c43d2b" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="16" font-weight="700" text-anchor="middle" opacity="1"><tspan x="257.5" y="641">只信渠道提供的身份事实</tspan><tspan x="257.5" y="660.2">channel · accountId · peer</tspan><tspan x="257.5" y="679.4">不让模型猜“是不是同一个人”</tspan></text>
<text fill="#76510e" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="start" opacity="1"><tspan x="565" y="219">常驻 Gateway · 一台主机一个控制面</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="770" y="288">Provider connections</tspan><tspan x="770" y="309.6">Typed WebSocket API</tspan><tspan x="770" y="331.2">health · presence · agent events</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="770" y="455">Deterministic bindings</tspan><tspan x="770" y="475.4">peer &gt; guild/team &gt; account &gt; channel</tspan><tspan x="770" y="495.8">同 tier 首条配置获胜</tspan><tspan x="770" y="516.2">遗漏 accountId ≠ wildcard</tspan></text>
<text fill="#c43d2b" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="770" y="653">Session key 是路由坐标</tspan><tspan x="770" y="674.6">不是 tenant authorization</tspan></text>
<text fill="#3f654d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="start" opacity="1"><tspan x="1100" y="219">Per-agent enclave · 状态分离，不是宿主隔离</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1322.5" y="288">agent: home</tspan><tspan x="1322.5" y="309.6"></tspan><tspan x="1322.5" y="331.2">workspace / bootstrap files</tspan><tspan x="1322.5" y="352.8">agentDir / auth profiles</tspan><tspan x="1322.5" y="374.4">sessions.json + JSONL</tspan><tspan x="1322.5" y="396">model + tool policy</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1322.5" y="543">agent: work</tspan><tspan x="1322.5" y="564.6"></tspan><tspan x="1322.5" y="586.2">独立 workspace / agentDir</tspan><tspan x="1322.5" y="607.8">独立 auth / session store</tspan><tspan x="1322.5" y="629.4">显式共享 memory/plugin 才跨界</tspan><tspan x="1322.5" y="651">workspace cwd ≠ sandbox</tspan></text>
<text fill="#695b83" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="start" opacity="1"><tspan x="565" y="859">设备与副作用信任边界 · 节点要配对，能力要授权，外部结果要可对账</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="720" y="923">Paired device node</tspan><tspan x="720" y="943.4">role + caps + commands</tspan><tspan x="720" y="963.8">camera · screen · location</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1060" y="923">Tool / sandbox policy</tspan><tspan x="1060" y="943.4">least privilege</tspan><tspan x="1060" y="963.8">approval + audit</tspan></text>
<text fill="#c43d2b" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1395" y="923">External effect</tspan><tspan x="1395" y="943.4">idempotency key</tspan><tspan x="1395" y="963.8">receipt + reconcile</tspan></text>
<text fill="#66625c" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="820" y="1107">连续性来自明确映射与受控 recall，不来自把所有渠道塞进同一会话 · per-agent 隔离不等于 hostile multi-tenant isolation · 一个不互信租户应拥有一个独立 Gateway cell</tspan></text>
</svg>
