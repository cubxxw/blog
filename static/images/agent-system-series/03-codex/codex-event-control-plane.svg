<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="250" y="266">CLI / TUI</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="575" y="266">IDE Extension</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="middle" opacity="1"><tspan x="900" y="265">Desktop / ChatGPT</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1285" y="265">Custom product / remote TUI</tspan></text>
<text fill="#55466f" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="700" text-anchor="middle" opacity="1"><tspan x="800" y="414">App Server · public JSON-RPC contract</tspan><tspan x="800" y="438">initialize → thread/start | resume | fork → turn/start | steer | interrupt → notifications</tspan></text>
<text fill="#3f654d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="700" text-anchor="start" opacity="1"><tspan x="290" y="553">Rust core · 内部实现层（不要当成稳定公共协议）</tspan></text>
<text fill="#76510e" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="middle" opacity="1"><tspan x="800" y="615">Submission Queue  →  user input · exec · interrupt · approval response</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="middle" opacity="1"><tspan x="800" y="700">Thread → Turn → Item · Agent loop + state</tspan></text>
<text fill="#3d6076" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="19" font-weight="700" text-anchor="middle" opacity="1"><tspan x="800" y="795">Event Queue  →  item delta · command progress · patch · turn/completed</tspan></text>
<text fill="#8f2e22" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="start" opacity="1"><tspan x="290" y="957">Effect boundary · 命令、写文件、网络与外部工具在这里接受治理</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="460" y="997">Approval · 何时询问</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="800" y="997">Sandbox · 技术边界</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" text-anchor="middle" opacity="1"><tspan x="1140" y="997">Effect · shell / patch / net</tspan></text>
<text fill="#66625c" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="400" text-anchor="middle" opacity="1"><tspan x="800" y="1097">所有权判断：Surface 拥有呈现与输入；App Server 拥有跨进程契约；core 拥有 loop 与权威任务状态；host policy 与 OS sandbox 共同约束副作用。</tspan></text>
</svg>
