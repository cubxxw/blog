<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="36" font-weight="700" text-anchor="start" opacity="1"><tspan x="64" y="72">demo 项目卡在哪？一次调用如何往返</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="24" font-weight="400" text-anchor="start" opacity="1"><tspan x="64" y="116">用户添加工具 → Nango 管授权 → 后端按账号执行 → 模型读结果</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="64" y="161">实线：本文远程接入范围；授权在浏览器里完成，凭证留在执行层。</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="86" y="250">用户 / 聊天</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="86" y="285">添加项目服务</tspan><tspan x="86" y="309">授权后回到原对话</tspan><tspan x="86" y="333">收到有依据的回答</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="437" y="250">产品后端</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="437" y="285">保存账号与等待中的任务</tspan><tspan x="437" y="309">校验连接归属和业务参数</tspan><tspan x="437" y="333">调用 MCP，筛选返回字段</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="908" y="250">Nango</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="908" y="285">处理 OAuth 授权</tspan><tspan x="908" y="309">保存、刷新凭证</tspan><tspan x="908" y="333">代理工具请求</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="1279" y="250">项目 MCP 服务</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="1279" y="285">提供工具菜单</tspan><tspan x="1279" y="309">执行 get_project_brief</tspan><tspan x="1279" y="333">返回项目状态与阻塞项</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="24" font-weight="700" text-anchor="start" opacity="1"><tspan x="437" y="665">模型</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="437" y="700">选择工具并提出参数</tspan><tspan x="437" y="724">读取返回的项目数据</tspan><tspan x="437" y="748">回答：等待移动端登录回归</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="341" y="267">① 地址</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="812" y="267">② 请求</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="1183" y="267">③ 调用</tspan></text>
<text fill="#496851" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="1210" y="451">④ 工具结果</tspan></text>
<text fill="#496851" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="905" y="570">结果回到后端</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="316" y="554">模型提议</tspan></text>
<text fill="#496851" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="553" y="554">⑤ 校验后</tspan><tspan x="553" y="575.6">交回模型</tspan></text>
<text fill="#496851" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="18" font-weight="400" text-anchor="start" opacity="1"><tspan x="65" y="757">⑥ 回到原聊天</tspan></text>
<text fill="#1f1f1d" font-family='Excalifont, Xiaolai, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif' font-size="20" font-weight="400" text-anchor="start" opacity="1"><tspan x="64" y="835">连接成功只是中间状态；这次任务的验收是查到 demo 项目的真实数据。</tspan></text>
