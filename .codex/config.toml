#:schema https://developers.openai.com/codex/config-schema.json

# Repository-local Codex roles. User policy, sandbox, search, credentials, and
# MCP connections stay in the user's Codex configuration.

[features]
multi_agent = true

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"

[agents.agent_architecture_researcher]
description = "Read-only researcher for the model loop, context, memory, tools, delegation, evals, and stop conditions of one Agent system."
config_file = "agents/agent-architecture-researcher.toml"

[agents.system_architecture_researcher]
description = "Read-only researcher for runtime, state, protocols, concurrency, recovery, security, deployment, and implementation choices."
config_file = "agents/system-architecture-researcher.toml"

[agents.product_ecosystem_researcher]
description = "Read-only researcher for user jobs, interaction design, value delivery, category boundaries, extensions, and ecosystem position."
config_file = "agents/product-ecosystem-researcher.toml"
