  - id: agent-diff-guard
    name: Agent Diff Guard
    stage_zh: 内部使用
    stage_en: Dogfood
    headline_zh: 看见哪个 Agent 在越界，哪个项目最烧 token。
    headline_en: See which agent crossed the line and which project is burning tokens.
    os_thesis_zh: 让 Agent 的改动与成本都有据可查。
    os_thesis_en: Make agent changes and costs inspectable.
    desc_zh: 在 push 前检查 Agent 是否改了 CI、密钥或测试，以及改动是否偏离任务。为持续运行的 Agent 声明范围、预算和停止条件，再结合本机会话日志查看越界记录、token 用量与估算成本。
    desc_en: Check risky CI, secret, and test changes before push, and compare edits with the assigned task. Define scope, budget, and stop conditions for agent loops, then inspect local policy events, token use, and estimated costs.
    audience_zh: 独立开发者 · Agent 操作者
    audience_en: Solo builders · Agent operators
    stack: Bun · TypeScript · Git · MCP
    color: cobalt
    mark: DG
    url: https://github.com/cubxxw/agent-diff-guard
    github: https://github.com/cubxxw/agent-diff-guard
    boundary_zh: 目前从源码运行；token 与成本按日志估算，守门检查不能替代完整代码审查。
    boundary_en: Run from source. Token use and costs are log-based estimates; the guard does not replace a complete code review.
    related: []
    tags: [agent, developer-tools, ai]
    progress: 72
    todo:
      - { zh: "token / 成本聚合与项目排行", en: "Token / cost aggregation & project ranking", done: true }
      - { zh: "pre-push + Hooks + MCP 接入", en: "Pre-push + Hooks + MCP", done: true }
      - { zh: "npm 全局安装包", en: "Global npm package", done: false }
      - { zh: "GitHub PR 评论与团队视图", en: "GitHub PR comments & team view", done: false }
