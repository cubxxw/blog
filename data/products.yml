products:
  - id: talent-signal
    name: capri
    featured: true
    stage_zh: 早期使用申请
    stage_en: Early access by request
    headline_zh: 接住重要的人和未完的事。
    headline_en: Keep important people and unfinished things close.
    os_thesis_zh: 留下你选择的背景，接续下一次交流。
    os_thesis_en: Keep the context you choose. Continue the conversation.
    desc_zh: 从你分享的聊天截图中整理认识背景、答应的事情和后来的变化，先看有来源的理解，再决定留下什么。capri 正在构建能接续同一个人、同一件事的个人 Agent。
    desc_en: Share a chat screenshot, review its sourced context, and choose what to keep. capri is building a personal Agent for remembering people, promises, and changes before the next conversation.
    audience_zh: 独立从业者 · 小团队创始人
    audience_en: Independent professionals · Small-team founders
    stack: Next.js · SwiftUI · TypeScript
    color: rust
    mark: CA
    url: https://gettalentsignal.com
    github: https://github.com/getyak/capir
    demo: https://gettalentsignal.com/demo
    image_alt_zh: capri 前身 Talent Signal 的早期首页截图，展示产品主张与证据关系图
    image_alt_en: An earlier Talent Signal homepage, before the capri rebrand, showing the product claim and an evidence map
    question_zh: 一张聊天截图能否留下值得记住的背景，让下一次交流接得上，并让新回复更新同一件未完事项？
    question_en: Can a shared screenshot preserve useful context for the next conversation and let a later reply update the same unfinished thing?
    boundary_zh: 公开演示使用合成案例；真实工作空间需申请，完整接续体验仍在验证。确认事实和授权外部发送是两个独立决定。
    boundary_en: Public demos use synthetic cases. Real workspaces require access approval, and the complete continuity journey is still being validated. Fact confirmation and permission to send are separate decisions.
    contract:
      - { zh: 每个重要判断都能回到来源, en: Every consequential claim resolves to its source }
      - { zh: 由你选择值得留下的背景与未完事项, en: You choose the context and unfinished things worth keeping }
      - { zh: 等待、暂停和没有下一步都是正常结果, en: Waiting, pausing, and having no next step are valid outcomes }
    related: []
    tags: [agent, ai, personal-productivity]

  - id: leafhour
    name: Leafhour
    stage_zh: 已上线
    stage_en: Live
    headline_zh: 留一点时间，读进一本书。
    headline_en: Stay with a book.
    os_thesis_zh: AI 帮你读下去，理解由自己形成。
    os_thesis_en: AI helps you keep reading. Understanding remains your own.
    desc_zh: 从上次停下的原句继续读一本书。导入 PDF、EPUB、TXT 或 Markdown，按需查看直译与意译，把自己的理解和问题留在原文旁，也可以开启阅读对话。
    desc_en: Continue a book from the sentence where you stopped. Import PDF, EPUB, TXT, or Markdown, compare literal and interpretive translations, and keep notes, questions, and reading conversations beside the source.
    audience_zh: 深度阅读者 · 原文阅读与语言学习
    audience_en: Deep readers · Original-language reading and language learning
    stack: Node.js · DeepSeek · Supabase · MCP
    color: sage
    mark: LH
    url: https://leafhour.com
    url_en: https://leafhour.com/en
    github: https://github.com/getyak/leafhour
    demo: https://leafhour.com/read?book=gutenberg-alice
    image_en: /images/products/leafhour-en.jpg
    image_alt_zh: Leafhour 官网首屏，森林绿标题 Stay with a book. 与窗边展开的书，呈现留一点时间读进一本书的主张
    image_alt_en: Leafhour homepage with the forest-green headline Stay with a book. beside an open book by a sunlit window
    question_zh: 中断几天后，能否从同一段原文和上次留下的问题继续，让 AI 的解释帮助自己形成理解？
    question_en: After a few days away, can returning to the same passage and an unfinished question help readers form their own understanding with AI support?
    boundary_zh: AI 译文与解释需要核对原文；翻译按需生成。扫描版 PDF、加密文件和带 DRM 的电子书暂不支持。
    boundary_en: Check AI translations and explanations against the source; translations are generated on request. Scanned PDFs, encrypted files, and DRM-protected books are not supported.
    related:
      - /growth/posts/ai-english-learning
    tags: [ai, learning, open-source]

  - id: imstage
    name: IMStage
    stage_zh: 已上线
    stage_en: Live
    headline_zh: 为测试与评测，创作可编辑的合成对话。
    headline_en: Create editable synthetic conversations for tests and evaluation.
    os_thesis_zh: 把虚构对话变成可复用的测试材料。
    os_thesis_en: Turn fictional conversations into reusable test material.
    desc_zh: 为软件测试、教学与评测数据集创作合成聊天场景。逐条编辑消息，复用人物与模板，批量制作项目变体，再导出带默认虚构标识的 PNG 或可编辑 JSON。
    desc_en: Author synthetic chat scenes for software tests, teaching, and evaluation datasets. Edit messages, reuse people and templates, create project variations, and export PNGs with a default fictional label or editable JSON.
    audience_zh: 软件测试 · 教学 · AI 评测
    audience_en: Software testing · Teaching · AI evaluation
    stack: React · Node · MCP
    color: rust
    mark: IM
    url: https://imstage.org
    url_zh: https://imstage.org/?lang=zh
    url_en: https://imstage.org/?lang=en
    github: https://github.com/kubbot/imstage
    image_fit: contain
    image_zh: /images/products/imstage-zh.jpg
    image_en: /images/products/imstage-en.jpg
    image_alt_zh: IMStage 早期首页的场景输入框与合成聊天预览，人物和照片均为虚构素材
    image_alt_en: An earlier IMStage homepage with a scene prompt, synthetic chat preview, fictional characters, and an AI-generated photo
    boundary_zh: 当前版本源码可用，仅限非商业测试、学习与研究；公开入口已禁用真实截图编辑，预览与导出默认带虚构标识。
    boundary_en: Current versions are source-available for non-commercial testing, learning, and research. Public real-screenshot editing is disabled; previews and exports carry a fictional label by default.
    related: []
    tags: [agent, ai, product-strategy]

  - id: solo-compass
    name: Roamorrow
    stage_zh: TestFlight 准备中
    stage_en: TestFlight prep
    headline_zh: 找到自己的方向，在路上也能自在生活。
    headline_en: Find your way. Feel at home.
    os_thesis_zh: AI 缩小选择，路线仍由你决定。
    os_thesis_en: AI narrows the options. You choose the route.
    desc_zh: 从 Solo Compass 演进而来的独行旅行伙伴。以地图为入口，把附近地点整理成具体可做的体验，用 AI 帮你筛选，并把地点来源和不确定性留在判断旁。
    desc_en: Evolved from Solo Compass, Roamorrow is a map-first companion for solo travel and life on the move. Discover concrete things to do nearby, with AI curation, source context, and uncertainty kept visible.
    audience_zh: 独自旅行者 · 数字游民
    audience_en: Solo travelers · Digital nomads
    stack: SwiftUI · MapKit · Supabase
    color: cobalt
    mark: RM
    url: https://roamorrow.com
    github: https://github.com/getyak/roamorrow
    boundary_zh: iOS 仍处于 TestFlight 准备阶段；地点信息与 AI 建议需要结合来源和当地实际情况核对。
    boundary_en: The iOS app remains in TestFlight preparation. Check place information and AI suggestions against their sources and local conditions.
    related:
      - /growth/posts/metacognitive-transformation-review
      - /growth/posts/2026-07-14-what-remains-when-taken-apart
    tags: [solo-travel, travel, ai]
    feedback: https://github.com/cubxxw/blog/issues/235
    progress: 72
    todo:
      - { zh: 地图优先的核心体验, en: Map-first core experience, done: true }
      - { zh: Solo Score 场所评分体系, en: Solo Score rating system, done: true }
      - { zh: TestFlight 内测, en: TestFlight beta, done: false }
      - { zh: 多语言与离线地图, en: i18n & offline maps, done: false }

  - id: daypage
    name: DayPage
    stage_zh: 持续开发
    stage_en: In development
    headline_zh: 不管理人生，只接住今天。
    headline_en: Don't manage your life. Hold on to today.
    os_thesis_zh: 先接住今天，再看见自己的变化。
    os_thesis_en: Hold on to today. See how you change.
    desc_zh: 以本地文件为基础的个人记忆系统。收下文字、语音、照片与日常背景，再用 AI 编译成每日页面、人物与主题页面，以及可以继续探索的知识图谱。
    desc_en: A local-first personal memory system that captures text, voice, photos, and daily context, then compiles them into Daily Pages, entity pages, and an explorable knowledge graph.
    audience_zh: 日常记录 · 个人知识积累
    audience_en: Daily capture · Personal knowledge
    stack: SwiftUI · Kotlin · Next.js · MCP
    color: amber
    mark: DP
    url: https://daypage.cubxxw.com
    github: https://github.com/getyak/daypage
    boundary_zh: 各客户端仍在持续开发，能力不完全一致；AI 编译结果需要回到原始记录核对。
    boundary_en: Clients are still evolving and do not all offer the same capabilities. Check AI-compiled pages against the original captures.
    related:
      - /growth/posts/2026-06-thought-notes
      - /growth/posts/2025-05-thought-notes
    tags: [mindfulness, personal-reflection, personal-productivity]
    feedback: https://github.com/cubxxw/blog/issues/236
    progress: 76
    todo:
      - { zh: iOS 私测与 2am AI 日记编译, en: iOS beta & 2am AI compile, done: true }
      - { zh: 手表与桌面小组件, en: Watch & desktop widgets, done: true }
      - { zh: 知识 wiki 图谱视图, en: Knowledge wiki graph view, done: false }
      - { zh: 导出与端到端备份, en: Export & E2E backup, done: false }

  - id: telepace
    name: Telepace
    stage_zh: 持续开发
    stage_en: In development
    headline_zh: 把一次真实失败，变成下一次发布的检验。
    headline_en: Turn a real failure into a check for the next release.
    os_thesis_zh: 让真实证据进入 AI 的评测与发布判断。
    os_thesis_en: Bring real evidence into AI evaluation and release decisions.
    desc_zh: 面向 AI 产品的 evidence-to-eval 工具。先定义什么算正确，再把生产问题、专家修正和用户意图编译成可回放的 Eval Pack，保留来源、评分标准与版本化发布门禁。
    desc_en: Evidence-to-eval infrastructure for AI products. Define correctness, then compile production failures, expert corrections, and user intent into replayable Eval Packs with provenance, rubrics, and versioned release gates.
    audience_zh: AI 产品团队 · 评测与质量负责人
    audience_en: AI product teams · Evaluation and quality leads
    stack: Python · Next.js · REST API · MCP
    color: sage
    mark: TP
    url: https://telepace.cubxxw.com
    github: https://github.com/getyak/telepace-next
    boundary_zh: 评测需要明确用例、权威来源和人工校准；访谈只用于补齐已识别的证据缺口。
    boundary_en: Evaluations need explicit cases, authoritative evidence, and human calibration. Interviews collect only the evidence needed to close identified gaps.
    related:
      - /ai-agent/posts/relay-agent-architecture-design
      - /growth/posts/super-individual-ai-product-and-solo-builder-stack
    tags: [product-development, agent, ai]
    feedback: https://github.com/cubxxw/blog/issues/237
    progress: 64
    todo:
      - { zh: 语音访谈引擎与招募闭环, en: Voice interview engine & recruiting loop, done: true }
      - { zh: MCP 接入与 60 秒体验访谈, en: MCP integration & 60-sec live demo, done: true }
      - { zh: 洞察报告 2.0, en: Insight reports 2.0, done: false }
      - { zh: 团队协作与工作区, en: Team workspaces, done: false }

  - id: apply-agent
    name: Vantage
    stage_zh: 持续开发
    stage_en: In development
    headline_zh: 从真实经历出发，准备下一次职业机会。
    headline_en: Build your next opportunity on real career evidence.
    os_thesis_zh: Agent 处理重复工作，机会由你决定。
    os_thesis_en: Let the agent handle repetition. You choose the opportunity.
    desc_zh: Relay 开源求职系统的产品界面。先审阅简历中的事实，再匹配岗位、准备定制材料与面试练习；浏览器扩展协助填表，最终投递由你在雇主网站确认。
    desc_en: The product interface for Relay, an open-source job-search system. Review career facts, match roles, prepare tailored materials and interviews, and use a browser extension to prepare forms before submitting yourself.
    audience_zh: 求职者 · 职业转型
    audience_en: Job seekers · Career transitions
    stack: Next.js · Hono · LangGraph
    color: coral
    mark: VA
    url: https://apply.cubxxw.com
    github: https://github.com/getyak/apply-agent
    boundary_zh: 职业事实需本人审阅；不会编造经历、保存招聘平台密码或绕过验证码，最终提交保留在你的浏览器里。
    boundary_en: You review career facts. The system does not invent experience, store job-platform passwords, bypass CAPTCHAs, or submit applications for you.
