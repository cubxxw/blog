  - id: solo-compass
    name: Solo Compass
    stage_zh: TestFlight 准备中
    stage_en: TestFlight prep
    headline_zh: 打开地图，找到附近真正值得去做的事。
    headline_en: Open the map. Find what is truly worth doing nearby.
    desc_zh: 面向独自旅行者的活地图：把附近地点变成具体、有故事感的体验，并用 AI 缩小选择范围，而不是替你做决定。
    desc_en: A living map for solo travelers that turns nearby places into concrete, story-rich experiences and uses AI to narrow the field—not make the decision.
    audience_zh: 独自旅行者 · 数字游民
    audience_en: Solo travelers · Digital nomads
    stack: SwiftUI · MapKit · AI
    color: cobalt
    mark: SC
    url: https://github.com/getyak/solo-compass
    github: https://github.com/getyak/solo-compass
    related:
