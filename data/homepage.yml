ai:
  # Voice card — sent to the backend as `persona` and merged into the system
  # prompt as a VOICE block. Tone only; facts live in the backend's
  # AUTHOR_PROFILE / atlas so the two never drift.
  sysPromptEn: "Voice: calm, a little poetic — like replying to a friend from the road. Default to 2-4 warm sentences; expand only when asked for depth or recommendations. First person. No emoji, no exclamation pileups."
  sysPromptZh: "语气：安静、克制、带一点诗意——像在旅途中回复朋友的消息。默认 2-4 句；被追问细节或请求推荐时才展开。第一人称『我』，不用 emoji，不堆感叹号。"
  hudTwinVal: "BEAR_AI · v3.0"
  hudProtocolVal: "AGENT · RAG"
  hudVoiceVal: "XINWEI · 熊"
  # Question pools: draw six without replacement once per page load.
  # Chinese wording is supplied by the author; English follows the same order.
  bubblesEn:
    - "Do people actually use your products?"
    - "If AI writes the code, what did you do?"
    - "Of all those notes, how many have you actually used?"
    - "Is working while traveling really that great?"
    - "Which article of yours would you tear apart today?"
    - "Would you pay for what you build?"
    - "Have you built something you couldn't be bothered to use?"
    - "Are you solving a problem, or inventing projects to keep busy?"
    - "Could you still build a product if you couldn't code?"
    - "When users say ‘it's pretty good’, do you believe them?"
    - "Do users care about the feature you won't cut?"
    - "What's the biggest waste of time you've ever built?"
    - "What would you tell indie developers to do less of?"
    - "Where did all the time AI saved you actually go?"
    - "Can you really tell when AI makes things up?"
    - "What did you hand to AI, then redo yourself?"
    - "At what step is AI most likely to lead you astray?"
    - "Do you ask AI to prove you're right?"
    - "What claim in the AI world can you no longer stand?"
    - "Can one person with AI really replace a team?"
    - "Which popular AI product leaves you unconvinced?"
    - "What would you rather do slowly than hand to AI?"
    - "Did you learn it, or just understand what you read?"
    - "How much of what you research have you actually run?"
    - "If you could keep just ten notes, which would you keep?"
    - "What lesson did you only accept after getting burned?"
    - "Do you use ‘I'm still learning’ to put off starting?"
    - "Which city lost its appeal after you lived there?"
    - "How did you get through your worst day living on the road?"
    - "Would you still travel like this without photos or posts?"
    - "After working alone for so long, do you ever want a regular job?"
    - "What have you actually given up for freedom?"
    - "What criticism did you resist, then later accept?"
    - "When did you last admit you were wrong?"
    - "What made you realize you're not that great?"
    - "Starting over, what would you spend less time on?"
  bubblesZh:
    - "你做的产品，真有人用吗？"
    - "AI 写代码，你到底干了什么？"
    - "记了那么多笔记，真用上了几条？"
    - "边旅行边工作，真有那么爽？"
    - "哪篇文章，你现在想打自己的脸？"
    - "你自己会掏钱买你做的东西吗？"
    - "有没有项目，做完后你自己都懒得用？"
    - "你是在解决问题，还是给自己找项目做？"
    - "不让你写代码，你还会做产品吗？"
    - "用户说“挺好的”，你就信了？"
    - "你舍不得删的功能，用户在乎吗？"
    - "你做过最浪费时间的东西是什么？"
    - "你最想劝独立开发者少做什么？"
    - "AI 替你省的时间，最后都花哪儿了？"
    - "AI 胡说八道的时候，你真能看出来吗？"
    - "哪件事交给 AI 后，你又亲自重做了？"
    - "AI 最容易把你带沟里的是哪一步？"
    - "你会不会让 AI 帮你证明自己是对的？"
    - "AI 圈哪句鬼话，你最听不下去？"
    - "一个人加 AI，真能顶一个团队吗？"
    - "哪个很火的 AI 产品，你就是不买账？"
    - "哪件事，你宁愿慢一点也不用 AI？"
    - "你是学会了，还是只是看懂了？"
    - "你研究的那些东西，有多少亲手跑过？"
    - "只能留十篇笔记，你会留下哪些？"
    - "哪个道理，你吃了亏才听进去？"
    - "你会不会用“还在学习”拖延动手？"
    - "哪个城市，你住过以后彻底祛魅了？"
    - "旅居最狼狈的一天，你是怎么过的？"
    - "不拍照、不发动态，你还会这样旅行吗？"
    - "一个人折腾久了，会不会也想找个班上？"
    - "为了自由，你具体放弃过什么？"
    - "哪句批评，当时不服，后来认了？"
    - "最近一次承认“我错了”，是什么时候？"
    - "哪件事让你发现，自己没那么牛？"
    - "从头再来，你会少折腾什么？"
