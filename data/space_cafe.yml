themes:
  - id: jiangnan
    name_zh: 江南夜雨
    name_en: Jiangnan at Night
    note_zh: 雨落在河上，灯留在桌边。
    note_en: Rain on the river. A light beside the desk.
  - id: zen
    name_zh: 禅庭
    name_en: Zen Courtyard
    note_zh: 雨后枫树，苔石与一池静水。
    note_en: Rain-cleared maples, moss and still water.
  - id: garden
    name_zh: 园林
    name_en: Scholar’s Garden
    note_zh: 借一窗竹影，留半日清闲。
    note_en: Bamboo shadows and an unhurried afternoon.
  - id: coast
    name_zh: 海岸
    name_en: By the Sea
    note_zh: 海风进来，思绪慢慢展开。
    note_en: An open horizon, a little room to think.
  - id: mountain
    name_zh: 山居
    name_en: Mountain Retreat
    note_zh: 云停在山腰，咖啡刚刚好。
    note_en: Clouds in the valley. Coffee on the desk.
  - id: lake
    name_zh: 湖畔
    name_en: Lakeside
    note_zh: 在水面与远山之间坐一会儿。
    note_en: A quiet seat between water and distant hills.
  - id: rain
    name_zh: 雨夜书屋
    name_en: Rain & Books
    note_zh: 窗外下雨，窗内有书和暖光。
    note_en: Rain outside. Books and warm light within.
