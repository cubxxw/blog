# Keep content in canonical sections

## Action

Place ordinary posts under `content/{lang}/{ai-agent|engineering|growth}/posts/` and project pages under `content/{lang}/projects/`. Use `articles` for the aggregate route.

## Evidence

- `CLAUDE.md` documents the bilingual v3 content architecture and retired paths.

