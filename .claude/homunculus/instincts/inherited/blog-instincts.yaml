# Validate through repository commands

## Action

Use `netlify dev` for local page checks, `hugo --minify` for a production build, relevant npm content checks for changed inputs, and `npm test` for affected browser flows. Do not compile through `make`.

## Evidence

- `CLAUDE.md` and `package.json` define the local server, production build, content checks, typecheck, and Playwright test commands.

