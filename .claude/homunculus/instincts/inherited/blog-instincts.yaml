# Route assets by delivery path

## Action

Put directly referenced article assets in `static/`. Put assets that require Hugo Pipes fingerprinting, minification, or SRI in `assets/`.

## Evidence

- `CLAUDE.md` documents the static and Hugo Pipes asset routing rules.
