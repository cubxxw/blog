# Follow the editorial workflow

## Action

Read `_briefs/README.md` and `docs/blog-editorial-workflow.md`; use `.claude/skills/write-blog-from-brief/SKILL.md`, and also use `.claude/skills/craft-article-opening/SKILL.md` for a new or rewritten opening.

## Evidence

- `CLAUDE.md` makes these workflows mandatory for brief-driven writing and openings.

