# Preserve publishing metadata

## Action

Use an explicit Shanghai `+08:00` timestamp, avoid future dates unless requested, omit `draft` and retired `categories`, keep descriptions plain, and use canonical tags from `config/tags-mapping.json`.

## Evidence

- `CLAUDE.md` defines the production publishing and taxonomy invariants.

